# 博客基础配置（由博客助手软件自动填写，也可手动修改）
baseURL = "https://oldmanGAO.github.io/blog/"
defaultContentLanguage = "zh-cn"
title = "dayByday"
theme = "DoIt"

enableRobotsTXT = true
# v1.6：关闭 GitInfo。学习笔记博客用文件 mtime 作为 lastmod 即可，避免本地预览/
# 构建时「仓库无 commit」导致 Hugo 报错退出。学习笔记博客不需要从 commit 时间戳
# 取最后修改时间，已推送过的老博客可在 PushHub 端保留默认开启。
enableGitInfo = false
enableEmoji = true
paginate = 12
rssLimit = 20

[taxonomies]
  tag = "tags"
  category = "categories"
  series = "series"
  author = "authors"

[permalinks]
  posts = ":contentbasename"

[outputs]
  home = ["HTML", "RSS", "JSON"]
  page = ["HTML", "MarkDown"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML", "RSS"]

[markup]
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = true
    lineNumbersInTable = true
    noClasses = false
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.extensions]
      definitionList = true
      footnote = true
      linkify = true
      strikethrough = true
      table = true
      taskList = true
      typographer = true
    [markup.goldmark.extensions.passthrough]
      enable = true
      [markup.goldmark.extensions.passthrough.delimiters]
        block = [["\\[", "\\]"], ["$$", "$$"]]
        inline = [["\\(", "\\)"]]
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 6

[languages]
  [languages.zh-cn]
    label = "简体中文"
    weight = 1
    hasCJKLanguage = true
    [languages.zh-cn.params]
      description = "我的个人学习笔记博客"
      keywords = ["学习笔记", "博客"]

[params]
  defaultTheme = "auto"
  gitRepo = "https://github.com/oldmanGAO/blog"
  dateFormat = "2006-01-02"
  [params.app]
    title = "dayByday"
    svgFavicon = "/favicon.svg"
    iconColor = "#2d8cf0"
    tileColor = "#2d8cf0"

  # 搜索（fuse：纯本地搜索，无需任何外部服务）
  [params.search]
    enable = true
    type = "fuse"
    contentLength = 4000
    placeholder = "搜索文章..."
    maxResultLength = 10
    snippetLength = 50
    highlightTag = "em"
    absoluteURL = false
    [params.search.fuse]
      isCaseSensitive = false
      minMatchCharLength = 2
      findAllMatches = false
      location = 0
      threshold = 0.3
      distance = 100
      ignoreLocation = true
      useExtendedSearch = false
      ignoreFieldNorm = false

  # 顶部导航
  [params.header]
    desktopMode = "fixed"
    mobileMode = "auto"
    themeChangeToggle = true
    [params.header.title]
      name = "dayByday"

  # 页脚
  [params.footer]
    enable = true
    hugo = true
    copyright = true
    author = true
    since = 2026

  # 主页
  [params.home]
    rss = 10
    [params.home.profile]
      enable = true
      avatarURL = ""
      subtitle = "recode"
      typeit = true
      social = true
      disclaimer = ""
    [params.home.posts]
      enable = true
      paginate = 8

  # 文章页
  [params.page]
    lightgallery = true
    rssFullText = false
    hiddenFromHomePage = false
    hiddenFromSearch = false
    [params.page.toc]
      enable = true
      keepStatic = false
      auto = true
    [params.page.code]
      copy = true
    [params.page.math]
      enable = false
    [params.page.share]
      enable = true
      Twitter = false
      Facebook = false
      Weibo = true
      Whatsapp = false
      Linkedin = false
      QQ = true

  # 列表页
  [params.list]
    paginate = 20
    [params.list.meta]
      date = true
      categories = true
      tags = true

  # 社交链接（留空则不显示）
  [params.social]
    RSS = true
    GitHub = "oldmanGAO"
    Email = ""
    Weibo = ""
    Zhihu = ""
    Bilibili = ""

